<div class="app-layout">
  <!-- Top Navigation Profile Header -->
  <app-header *ngIf="stateService.userProfile().isLoggedIn"></app-header>

  <div class="app-body">
    <!-- Left Collapsible Sidebar Navigation Menu -->
    <app-sidebar *ngIf="stateService.userProfile().isLoggedIn"></app-sidebar>

    <!-- Main Dynamic Content Workspace View -->
    <main class="main-content-view">
      <!-- VIEW 0: Login / Sign-In Page -->
      <app-login *ngIf="stateService.currentView() === 'login'"></app-login>

      <!-- VIEW 1: 3-Step Guided Wizard (Occasion -> Format -> Theme) -->
      <app-wizard *ngIf="stateService.currentView() === 'wizard'"></app-wizard>

      <!-- VIEW 2: Interactive Card Studio Canvas Editor -->
      <app-editor *ngIf="stateService.currentView() === 'editor'"></app-editor>

      <!-- VIEW 3: My Cards Collections Dashboard (Drafts & Saved Cards) -->
      <app-collections *ngIf="stateService.currentView() === 'collections'"></app-collections>
    </main>
  </div>

  <!-- Grammarly-Style AI Writing Assistant Sidekick Drawer Overlay -->
  <app-ai-assistant></app-ai-assistant>
</div>
