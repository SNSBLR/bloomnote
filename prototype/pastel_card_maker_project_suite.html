<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerdantCards - Pastel Card Creator & Project Suite</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            pastel: {
              50: '#f2f8f4',
              100: '#e1efe5',
              200: '#c5e0cd',
              300: '#9ecaa9',
              400: '#72ad81',
              500: '#509161',
              600: '#3c744c',
              700: '#325d3f',
              800: '#2a4b34',
              900: '#233f2c',
              sage: '#d8e2dc',
              mint: '#e8f5e9',
              cream: '#faf9f6',
              blush: '#fec89a',
              lavender: '#e8e8e4'
            }
          },
          fontFamily: {
            sans: ['Poppins', 'sans-serif'],
            serif: ['Playfair Display', 'serif'],
            cursive: ['Dancing Script', 'cursive'],
            handwriting: ['Caveat', 'cursive'],
            fun: ['Pacifico', 'cursive'],
            clean: ['Montserrat', 'sans-serif']
          }
        }
      }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Dancing+Script:wght@400..700&family=Montserrat:wght@300;400;600;700&family=Pacifico&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>

  <style>
    /* Print Optimization Rules for Exporting PDFs */
    @media print {
      body * {
        visibility: hidden;
      }
      #printable-area, #printable-area * {
        visibility: visible;
      }
      #printable-area {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        margin: 0;
        padding: 20px;
        background: #ffffff !important;
        color: #000000 !important;
      }
      .no-print {
        display: none !important;
      }
      .page-break {
        page-break-before: always;
      }
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.05);
    }
    ::-webkit-scrollbar-thumb {
      background: #a3c9ad;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #72ad81;
    }

    .pastel-card-shadow {
      box-shadow: 0 10px 25px -5px rgba(80, 145, 97, 0.12), 0 8px 10px -6px rgba(80, 145, 97, 0.08);
    }

    .canvas-container {
      background-image: radial-gradient(#c5e0cd 1px, transparent 1px);
      background-size: 16px 16px;
    }
  </style>
</head>
<body class="bg-pastel-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 font-sans antialiased transition-colors duration-300 min-h-screen">
  
  <div id="root"></div>

  <script type="text/babel">

    const { useState, useEffect, useRef } = React;

    // --- Mock User State ---
    const INITIAL_USER = {
      name: "Sophia Martinez",
      email: "sophia.m@example.com",
      avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=150&auto=format&fit=crop&q=80",
      isLoggedIn: true
    };

    // --- Initial Cards Collection State ---
    const INITIAL_COLLECTION = [
      {
        id: "c1",
        title: "Thank You Mentor",
        category: "Gratitude",
        format: "Folding Vertical",
        theme: "Soft Botanical",
        message: "Thank you for always guiding me through every step of my career path!",
        font: "font-serif",
        color: "#2a4b34",
        stickers: ["🌿", "✨"],
        updatedAt: "2026-08-10",
        isDraft: false
      },
      {
        id: "c2",
        title: "Liam's 7th Birthday",
        category: "Birthday",
        format: "Square Social",
        theme: "Pastel Rainbow",
        message: "Wishing you a birthday full of dinosaurs, fun, and delicious cake!",
        font: "font-fun",
        color: "#d97706",
        stickers: ["🎂", "🎈", "🎉"],
        updatedAt: "2026-08-11",
        isDraft: true
      }
    ];

    // --- Main App Component ---
    function App() {
      const [darkMode, setDarkMode] = useState(false);
      const [sidebarOpen, setSidebarOpen] = useState(true);
      const [currentView, setCurrentView] = useState('create'); // 'create', 'collections', 'prd', 'project-plan', 'current-plan', 'login'
      const [user, setUser] = useState(INITIAL_USER);
      const [myCards, setMyCards] = useState(INITIAL_COLLECTION);
      const [profileMenuOpen, setProfileMenuOpen] = useState(false);

      // Card Creation Wizard State
      const [wizardStep, setWizardStep] = useState(1); // 1: Type, 2: Format, 3: Theme, 4: Studio
      const [cardConfig, setCardConfig] = useState({
        id: null,
        category: 'Gratitude',
        format: 'Folding Vertical',
        theme: 'Soft Botanical',
        heading: 'A Heartfelt Thank You',
        message: 'Thank you for your warmth, guidance, and endless kindness. You make the world a brighter place everyday!',
        font: 'font-serif',
        textColor: '#325d3f',
        bgColor: '#e1efe5',
        stickers: ['🌿', "✨"],
        photoUrl: null,
        isDraft: true
      });

      // AI Chatbot State & Toast System
      const [aiOpen, setAiOpen] = useState(false);
      const [aiLoading, setAiLoading] = useState(false);
      const [aiSuggestions, setAiSuggestions] = useState([]);
      const [toast, setToast] = useState({ message: '', visible: false });

      const showToast = (message) => {
        setToast({ message, visible: true });
        setTimeout(() => {
          setToast({ message: '', visible: false });
        }, 3000);
      };

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      }, [darkMode]);

      // Handle PDF Printing
      const handlePrintPDF = (title) => {
        window.print();
      };

      // Navigation handler
      const navigateTo = (view) => {
        setCurrentView(view);
        setProfileMenuOpen(false);
      };

      // Reset Card Wizard
      const startNewCard = () => {
        setCardConfig({
          id: 'card_' + Date.now(),
          category: 'Gratitude',
          format: 'Folding Vertical',
          theme: 'Soft Botanical',
          heading: 'A Heartfelt Thank You',
          message: 'Thank you for your warmth, guidance, and endless kindness.',
          font: 'font-serif',
          textColor: '#325d3f',
          bgColor: '#e1efe5',
          stickers: ['🌿'],
          photoUrl: null,
          isDraft: true
        });
        setWizardStep(1);
        setCurrentView('create');
      };

      // Load existing draft
      const loadDraftCard = (card) => {
        setCardConfig({
          ...card,
          heading: card.title || 'Personalized Card',
          textColor: card.color || '#325d3f',
          bgColor: '#e1efe5'
        });
        setWizardStep(4);
        setCurrentView('create');
      };

      return (
        <div className="flex h-screen overflow-hidden bg-pastel-50 dark:bg-gray-900 transition-colors duration-300">
          
          {/* LEFT SIDEBAR */}
          <aside className={`${sidebarOpen ? 'w-64' : 'w-20'} bg-white dark:bg-gray-800 border-r border-pastel-200 dark:border-gray-700 flex flex-col justify-between transition-all duration-300 z-30 shadow-sm relative no-print`}>
            
            {/* Top Logo & Toggle */}
            <div>
              <div className="p-4 flex items-center justify-between border-b border-pastel-100 dark:border-gray-700">
                {sidebarOpen ? (
                  <div className="flex items-center space-x-2 cursor-pointer" onClick={() => navigateTo('create')}>
                    <div className="w-9 h-9 rounded-xl bg-pastel-300 dark:bg-pastel-600 flex items-center justify-center text-white font-bold text-xl shadow-sm">
                      🍃
                    </div>
                    <div>
                      <h1 className="font-bold text-pastel-800 dark:text-pastel-200 text-lg leading-tight">Verdant</h1>
                      <p className="text-xs text-pastel-500 dark:text-pastel-400">Pastel Cards & AI</p>
                    </div>
                  </div>
                ) : (
                  <div className="w-9 h-9 rounded-xl bg-pastel-300 dark:bg-pastel-600 flex items-center justify-center text-white font-bold text-xl mx-auto cursor-pointer" onClick={() => navigateTo('create')}>
                    🍃
                  </div>
                )}

                {/* Sidebar Collapse Button */}
                <button 
                  onClick={() => setSidebarOpen(!sidebarOpen)}
                  className="p-1.5 rounded-lg bg-pastel-100 dark:bg-gray-700 text-pastel-700 dark:text-gray-200 hover:bg-pastel-200 transition"
                  title={sidebarOpen ? "Minimize Menu" : "Expand Menu"}
                >
                  <svg className={`w-5 h-5 transform transition-transform ${!sidebarOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
                  </svg>
                </button>
              </div>

              {/* Main Navigation */}
              <nav className="p-3 space-y-1.5">
                
                {/* Create / New Card */}
                <button
                  onClick={startNewCard}
                  className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${
                    currentView === 'create' 
                      ? 'bg-pastel-300 text-pastel-900 font-semibold shadow-sm dark:bg-pastel-600 dark:text-white' 
                      : 'text-gray-600 dark:text-gray-300 hover:bg-pastel-100 dark:hover:bg-gray-700'
                  }`}
                >
                  <span className="text-xl">✨</span>
                  {sidebarOpen && <span>Create / New</span>}
                </button>

                {/* My Cards Collections */}
                <button
                  onClick={() => navigateTo('collections')}
                  className={`w-full flex items-center space-x-3 px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all ${
                    currentView === 'collections' 
                      ? 'bg-pastel-300 text-pastel-900 font-semibold shadow-sm dark:bg-pastel-600 dark:text-white' 
                      : 'text-gray-600 dark:text-gray-300 hover:bg-pastel-100 dark:hover:bg-gray-700'
                  }`}
                >
                  <span className="text-xl">🖼️</span>
                  {sidebarOpen && (
                    <div className="flex items-center justify-between w-full">
                      <span>My Collections</span>
                      <span className="text-xs bg-pastel-200 dark:bg-gray-700 text-pastel-800 dark:text-gray-200 px-2 py-0.5 rounded-full font-bold">
                        {myCards.length}
                      </span>
                    </div>
                  )}
                </button>

                <div className="my-3 border-t border-pastel-100 dark:border-gray-700 pt-3">
                  {sidebarOpen && <p className="px-3 text-xs font-semibold text-pastel-600 dark:text-pastel-400 uppercase tracking-wider mb-2">Project Docs</p>}
                  
                  {/* PRD */}
                  <button
                    onClick={() => navigateTo('prd')}
                    className={`w-full flex items-center space-x-3 px-3.5 py-2 rounded-xl text-sm font-medium transition-all ${
                      currentView === 'prd' 
                        ? 'bg-pastel-200 text-pastel-900 font-semibold dark:bg-gray-700 dark:text-white' 
                        : 'text-gray-600 dark:text-gray-300 hover:bg-pastel-100 dark:hover:bg-gray-700'
                    }`}
                  >
                    <span className="text-lg">📄</span>
                    {sidebarOpen && <span>PRD Document</span>}
                  </button>

                  {/* Project Plan */}
                  <button
                    onClick={() => navigateTo('project-plan')}
                    className={`w-full flex items-center space-x-3 px-3.5 py-2 rounded-xl text-sm font-medium transition-all ${
                      currentView === 'project-plan' 
                        ? 'bg-pastel-200 text-pastel-900 font-semibold dark:bg-gray-700 dark:text-white' 
                        : 'text-gray-600 dark:text-gray-300 hover:bg-pastel-100 dark:hover:bg-gray-700'
                    }`}
                  >
                    <span className="text-lg">🗺️</span>
                    {sidebarOpen && <span>Project Plan</span>}
                  </button>

                  {/* Current Plan */}
                  <button
                    onClick={() => navigateTo('current-plan')}
                    className={`w-full flex items-center space-x-3 px-3.5 py-2 rounded-xl text-sm font-medium transition-all ${
                      currentView === 'current-plan' 
                        ? 'bg-pastel-200 text-pastel-900 font-semibold dark:bg-gray-700 dark:text-white' 
                        : 'text-gray-600 dark:text-gray-300 hover:bg-pastel-100 dark:hover:bg-gray-700'
                    }`}
                  >
                    <span className="text-lg">🚀</span>
                    {sidebarOpen && <span>Current Plan (Sprint 1)</span>}
                  </button>
                </div>

              </nav>
            </div>

            {/* Bottom Theme Switcher */}
            <div className="p-3 border-t border-pastel-100 dark:border-gray-700">
              <button
                onClick={() => setDarkMode(!darkMode)}
                className="w-full flex items-center justify-between p-2.5 rounded-xl bg-pastel-100 dark:bg-gray-700 text-gray-700 dark:text-gray-200 hover:bg-pastel-200 transition"
              >
                <div className="flex items-center space-x-2">
                  <span className="text-lg">{darkMode ? '🌙' : '☀️'}</span>
                  {sidebarOpen && <span className="text-xs font-semibold">{darkMode ? 'Dark Theme' : 'Light Theme'}</span>}
                </div>
                {sidebarOpen && (
                  <div className={`w-8 h-4 rounded-full p-0.5 transition-colors ${darkMode ? 'bg-pastel-500' : 'bg-gray-300'}`}>
                    <div className={`w-3 h-3 bg-white rounded-full transform transition-transform ${darkMode ? 'translate-x-4' : 'translate-x-0'}`}></div>
                  </div>
                )}
              </button>
            </div>

          </aside>

          {/* MAIN CONTENT WRAPPER */}
          <div className="flex-1 flex flex-col h-screen overflow-hidden">
            
            {/* TOP HEADER */}
            <header className="h-16 bg-white dark:bg-gray-800 border-b border-pastel-200 dark:border-gray-700 flex items-center justify-between px-6 z-20 no-print">
              
              {/* Header Title / Breadcrumb */}
              <div className="flex items-center space-x-3">
                <span className="text-xs px-2.5 py-1 rounded-full bg-pastel-200 text-pastel-800 dark:bg-pastel-900 dark:text-pastel-200 font-medium">
                  Pastel Theme
                </span>
                <h2 className="text-lg font-semibold text-gray-800 dark:text-gray-100">
                  {currentView === 'create' && `Card Builder ${wizardStep < 4 ? `(Step ${wizardStep} of 3)` : 'Studio'}`}
                  {currentView === 'collections' && 'My Saved Cards & Drafts'}
                  {currentView === 'prd' && 'Product Requirements Document (PRD)'}
                  {currentView === 'project-plan' && 'Master Project Plan (8 Weeks)'}
                  {currentView === 'current-plan' && 'Current Plan (Sprint 1 Roadmap)'}
                  {currentView === 'login' && 'User Authentication'}
                </h2>
              </div>

              {/* Top Right Profile & Auth */}
              <div className="flex items-center space-x-4 relative">
                
                {user.isLoggedIn ? (
                  <div className="relative">
                    <button 
                      onClick={() => setProfileMenuOpen(!profileMenuOpen)}
                      className="flex items-center space-x-3 p-1.5 rounded-full hover:bg-pastel-100 dark:hover:bg-gray-700 transition"
                    >
                      <img 
                        src={user.avatar} 
                        alt={user.name} 
                        className="w-9 h-9 rounded-full object-cover border-2 border-pastel-300"
                      />
                      <div className="hidden md:block text-left pr-1">
                        <p className="text-xs font-semibold text-gray-800 dark:text-gray-200 leading-none">{user.name}</p>
                        <p className="text-[10px] text-pastel-600 dark:text-pastel-400 leading-tight">Google Account</p>
                      </div>
                      <svg className="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                      </svg>
                    </button>

                    {/* Profile Dropdown */}
                    {profileMenuOpen && (
                      <div className="absolute right-0 mt-2 w-56 bg-white dark:bg-gray-800 rounded-2xl shadow-xl border border-pastel-200 dark:border-gray-700 p-2 z-50 animate-fade-in">
                        <div className="p-2 border-b border-pastel-100 dark:border-gray-700">
                          <p className="text-xs font-bold text-gray-800 dark:text-gray-100">{user.name}</p>
                          <p className="text-xs text-gray-500 dark:text-gray-400 truncate">{user.email}</p>
                          <span className="mt-1 inline-flex items-center text-[10px] bg-green-100 text-green-800 px-2 py-0.5 rounded-full font-medium">
                            <span className="w-1.5 h-1.5 bg-green-500 rounded-full mr-1"></span> Signed in with Google
                          </span>
                        </div>
                        <button 
                          onClick={() => { navigateTo('collections'); }} 
                          className="w-full text-left px-3 py-2 text-xs text-gray-700 dark:text-gray-200 hover:bg-pastel-100 dark:hover:bg-gray-700 rounded-lg transition mt-1"
                        >
                          🖼️ My Saved Cards
                        </button>
                        <button 
                          onClick={() => { setUser({ ...user, isLoggedIn: false }); setProfileMenuOpen(false); setCurrentView('login'); }} 
                          className="w-full text-left px-3 py-2 text-xs text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-gray-700 rounded-lg transition"
                        >
                          🚪 Sign Out
                        </button>
                      </div>
                    )}
                  </div>
                ) : (
                  <button 
                    onClick={() => setCurrentView('login')}
                    className="flex items-center space-x-2 bg-pastel-400 hover:bg-pastel-500 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow-sm transition"
                  >
                    <span>Log In / Google Sign In</span>
                  </button>
                )}

              </div>
            </header>

            {/* DYNAMIC VIEW CONTAINER */}
            <main className="flex-1 overflow-y-auto p-6">
              
              {/* 1. LOGIN / SIGN IN PAGE */}
              {currentView === 'login' && (
                <div className="max-w-md mx-auto my-12 bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-lg border border-pastel-200 dark:border-gray-700 text-center">
                  <div className="w-16 h-16 bg-pastel-200 dark:bg-pastel-700 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">
                    🍃
                  </div>
                  <h2 className="text-2xl font-bold text-gray-800 dark:text-white">Welcome to Verdant</h2>
                  <p className="text-xs text-gray-500 dark:text-gray-400 mt-1 mb-6">Create personalized pastel cards with AI grammar & text polish.</p>
                  
                  {/* Google Auth Button */}
                  <button 
                    onClick={() => { setUser(INITIAL_USER); setCurrentView('create'); }}
                    className="w-full flex items-center justify-center space-x-3 bg-white border border-gray-300 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-700 py-3 px-4 rounded-2xl text-sm font-medium text-gray-700 dark:text-gray-200 transition shadow-sm mb-4"
                  >
                    <svg className="w-5 h-5" viewBox="0 0 24 24">
                      <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                      <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                      <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z" />
                      <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    <span>Sign in with Google</span>
                  </button>

                  <div className="relative my-6">
                    <div className="absolute inset-0 flex items-center"><div className="w-full border-t border-gray-200 dark:border-gray-700"></div></div>
                    <div className="relative flex justify-center text-xs uppercase"><span className="bg-white dark:bg-gray-800 px-2 text-gray-400">Or email</span></div>
                  </div>

                  <div className="space-y-3 text-left">
                    <div>
                      <label className="text-xs font-semibold text-gray-600 dark:text-gray-300">Email Address</label>
                      <input type="email" defaultValue="sophia.m@example.com" className="w-full mt-1 p-2.5 rounded-xl border border-pastel-200 dark:border-gray-700 bg-pastel-50 dark:bg-gray-900 text-xs focus:ring-2 focus:ring-pastel-400 outline-none" />
                    </div>
                    <div>
                      <label className="text-xs font-semibold text-gray-600 dark:text-gray-300">Password</label>
                      <input type="password" defaultValue="••••••••" className="w-full mt-1 p-2.5 rounded-xl border border-pastel-200 dark:border-gray-700 bg-pastel-50 dark:bg-gray-900 text-xs focus:ring-2 focus:ring-pastel-400 outline-none" />
                    </div>
                    <button 
                      onClick={() => { setUser(INITIAL_USER); setCurrentView('create'); }}
                      className="w-full bg-pastel-500 hover:bg-pastel-600 text-white py-3 rounded-xl text-xs font-semibold transition mt-2 shadow-sm"
                    >
                      Log In
                    </button>
                  </div>
                </div>
              )}

              {/* 2. CREATE CARD WIZARD / STUDIO */}
              {currentView === 'create' && (
                <div className="max-w-6xl mx-auto space-y-6">
                  
                  {/* WIZARD STEP NAVIGATION BAR */}
                  <div className="bg-white dark:bg-gray-800 p-4 rounded-2xl border border-pastel-200 dark:border-gray-700 flex items-center justify-between shadow-sm no-print">
                    <div className="flex items-center space-x-2 md:space-x-8">
                      
                      {/* Step 1 */}
                      <button 
                        onClick={() => setWizardStep(1)}
                        className={`flex items-center space-x-2 text-xs font-semibold ${wizardStep >= 1 ? 'text-pastel-700 dark:text-pastel-300' : 'text-gray-400'}`}
                      >
                        <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs ${wizardStep === 1 ? 'bg-pastel-500 text-white' : 'bg-pastel-100 text-pastel-800'}`}>1</span>
                        <span className="hidden md:inline">Select Card Type</span>
                      </button>
                      <span className="text-gray-300">→</span>

                      {/* Step 2 */}
                      <button 
                        onClick={() => setWizardStep(2)}
                        className={`flex items-center space-x-2 text-xs font-semibold ${wizardStep >= 2 ? 'text-pastel-700 dark:text-pastel-300' : 'text-gray-400'}`}
                      >
                        <span className={`w-6 h-6 rounded-full flex items-center justify-center text-xs ${wizardStep === 2 ? 'bg-pastel-500 text-white' : 'bg-pastel-100 text-pastel-800'}`}>2</span>
                        <span className="hidden md:inline">Choose Format</span>
                      </button>
